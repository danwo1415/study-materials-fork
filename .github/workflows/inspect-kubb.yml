name: Inspect MyVideo Playtest public streams
on:
  push:
    branches: [myvideo-ikanbot-playtest]
    paths:
      - "scripts/inspect-kubb.py"
      - ".github/workflows/inspect-kubb.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    name: Probe public Ikanbot playback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inspect-kubb.py
