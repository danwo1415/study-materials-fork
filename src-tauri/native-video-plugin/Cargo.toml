[package]
name = "tauri-plugin-nativevideo"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-nativevideo"

[lib]
name = "tauri_plugin_nativevideo"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
